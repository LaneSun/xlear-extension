# 推送 `v*` 标签时出发布包并建 Release。
#
# 产物与本地 `pnpm run pack` 完全一致（同一套脚本），差别只在私钥来源：
# 这里从仓库 secret `CRX_KEY` 取 —— 一把钥匙对应一个扩展 ID，丢了就得换 ID，
# 因此它同时应该离线备份（见 docs/RELEASING.md）。

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 写入签名私钥
        env:
          CRX_KEY: ${{ secrets.CRX_KEY }}
        run: |
          if [ -z "$CRX_KEY" ]; then
            echo "::error::缺少仓库 secret CRX_KEY（内容见 docs/RELEASING.md）—— 没有它签不了 crx，发布中止。"
            exit 1
          fi
          printf '%s' "$CRX_KEY" > "$RUNNER_TEMP/crx-key.pem"
          chmod 600 "$RUNNER_TEMP/crx-key.pem"

      - name: 打包（zip / xpi / crx / 校验和）
        env:
          CRX_KEY_FILE: ${{ runner.temp }}/crx-key.pem
          CHROME_BIN: google-chrome
          # 更新清单要写死 crx 的下载地址，所以这里告诉它发布位置
          XL_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases
        run: pnpm run pack

      # ---------------------------------------------------------------------------
      # 已停用：unlisted 签名（自托管安装用的 …-signed.xpi）。
      #
      # 原因：AMO 对同一个版本号只接受一次提交，而 `amo-listed` 工作流会在 main 上版本号变化时
      # 先把这一版交到 listed（公开列表页，签名文件由 AMO 托管）；那之后这里再签 unlisted
      # 必然报 "Version X already exists."。listed 是面向用户的通道，所以这里让位。
      #
      # 需要自托管用的签名 xpi 时，用 docs/RELEASING.md 里的手动命令单独签一次
      # （同一个版本只能签一次）。要重新启用，去掉下面这些行的注释即可。
      # ---------------------------------------------------------------------------
      #
      # - name: 看看有没有 AMO 凭据（没有就跳过签名）
      #   id: amo
      #   env:
      #     MOZILLA_API_KEY: ${{ secrets.MOZILLA_API_KEY }}
      #   run: |
      #     if [ -z "$MOZILLA_API_KEY" ]; then
      #       echo "::notice::未配置 MOZILLA_API_KEY / MOZILLA_API_SECRET，跳过 xpi 签名。缺少签名时 Firefox 正式版无法安装，见 docs/RELEASING.md。"
      #       echo "enabled=false" >> "$GITHUB_OUTPUT"
      #     else
      #       echo "enabled=true" >> "$GITHUB_OUTPUT"
      #     fi
      #
      # - name: 让 AMO 给 xpi 签名（unlisted：自托管安装用）
      #   if: steps.amo.outputs.enabled == 'true'
      #   continue-on-error: true
      #   env:
      #     WEB_EXT_API_KEY: ${{ secrets.MOZILLA_API_KEY }}
      #     WEB_EXT_API_SECRET: ${{ secrets.MOZILLA_API_SECRET }}
      #   run: |
      #     # unlisted 是唯一会把签好名的 xpi 交给我们的通道（官方文档原话）；
      #     # 同一个版本号不能重复提交，所以重跑本工作流时这里会失败 —— 因此上面允许失败。
      #     npx --yes web-ext@latest sign \
      #       --source-dir .output/firefox-mv3 \
      #       --channel=unlisted \
      #       --artifacts-dir .output/amo \
      #       --no-input
      #     for f in .output/amo/*.xpi; do
      #       [ -e "$f" ] || continue
      #       mv "$f" ".output/$(basename "$f" .xpi)-signed.xpi"
      #     done
      #

      - name: 建 Release 并挂产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            .output/*.zip .output/*.xpi .output/*.crx .output/updates.xml .output/SHA256SUMS
